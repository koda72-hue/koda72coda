<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>コダデザイン室｜ご依頼テンプレート</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px 80px;
      background: #ffffff;
      color: #222222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "YuGothic",
        sans-serif;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 50px;
      padding-bottom: 25px;
      border-bottom: 1px solid #dddddd;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: 600;
    }

    .description {
      margin: 0;
      font-size: 14px;
      line-height: 1.8;
      color: #666666;
    }

    .template {
      margin-bottom: 60px;
    }

    .template-title {
      margin: 0 0 15px;
      font-size: 20px;
      font-weight: 600;
    }

    .template-text {
      width: 100%;
      height: 100px;
      padding: 20px;

      border: 1px solid #cccccc;
      border-radius: 4px;

      background: #ffffff;
      color: #222222;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "YuGothic",
        sans-serif;

      font-size: 14px;
      line-height: 1.8;

      resize: vertical;
    }

    .copy-button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 14px;

      border: none;
      border-radius: 4px;

      background: #222222;
      color: #ffffff;

      font-family: inherit;
      font-size: 14px;

      cursor: pointer;

      transition: opacity 0.2s;
    }

    .copy-button:hover {
      opacity: 0.8;
    }

    footer {
      padding-top: 20px;
      border-top: 1px solid #dddddd;

      font-size: 12px;
      color: #888888;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 25px 15px 60px;
      }

      h1 {
        font-size: 23px;
      }

      .template-text {
        height: 500px;
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <main>

    <header>
      <h1>コダデザイン室</h1>

      <p class="description">
        ご依頼時に必要なテンプレートです。<br>
        下の「テンプレートをコピー」ボタンからコピーしてご利用ください。<br>
事前にご連絡頂いた要件定義以外の、後出し情報に起因する修正は追加費用となりますのでお気をつけ下さい。
      </p>
    </header>


    <!-- 表紙デザイン依頼テンプレート -->

    <section class="template">

      <h2 class="template-title">
        表紙デザイン依頼テンプレート
      </h2>

      <textarea
        id="template-1"
        class="template-text"
        readonly
      >表紙

● 納品希望日
○月○日
※入稿日当日の納品希望はご遠慮ください。
※日数が少ない場合、特急対応可否をご相談させていただく可能性があります。

● 本のサイズ
A5／B5／新書／A6文庫／その他変形

● 背幅
未確定の場合は概算値と確定予定日

● 背表紙文字入れ
3mm以上から対応可能。

● 綴じ方向
右綴じ／左綴じ

● 入稿予定カラーモード
RGB／CMYK

● 利用予定印刷所
テンプレート利用時はURLも記載

● 利用予定装丁
PP加工、特殊紙等

● 年齢制限
全年齢／R18

● サークル名・HN

● 発行日

● 表紙掲載文字
タイトル、ジャンル、CP、R18表記、サークル名等。
表1・表4への掲載希望があればご記載ください。
そのまま使用するため誤字脱字にご注意ください。
・必須の文字
・任意の文字
・装飾文字追加NGの場合はその旨

● 本文内容
漫画／小説／その他

● 支給データ
使用素材・イラスト等はクラウド経由などで元データをご支給ください。
※イラストは完成後にご連絡ください。
※解像度は印刷所推奨値（通常350dpi以上）をご確認ください。
※人物・背景が分かれたPSD推奨です。

● 支給イラスト加工可否
・トリミング：OK／NG
・回転：OK／NG
・色調調整：OK／NG

● 表紙に反映したい要素
・キーアイテム（あれば）
・物語の流れ（ハピエン、コメディ、シリアス等）
・雰囲気（シンプル、ポップ、繊細、上品、スタイリッシュ、ダイナミック等）
・明度（明るめ／暗め）
・彩度（鮮やか／くすみ）
・濃度（濃い／薄い）
※全て反映できるとは限りません。
※特に重視したい点があればご記載ください。

● 参考資料
イメージに近いものを商業・同人問わず1点のみご提示ください。
主体となる資料を提示頂ければ、補足資料を頂いても問題ございません。
「全体の雰囲気は参考資料の通りだが、タイトル文字は別資料を参考にしたい」「この資料の雰囲気で色を変更」などの補足を頂ければ助かります。

● その他要望
「支給イラストで強調したい部位、隠したい部位」など
「避けてほしい表現」も含め、依頼時点で必ずご記載ください。

● 電子書籍、配信、ダウンロード販売の有無
あり／なし
※ありの場合、使用料が発生しますのでオプションをご確認ください。

● 発行形式
個人誌／合同誌・アンソロジー
※制作に関わる人物が複数になる場合、オプション費用が発生します。

● オプション利用
（必要な方のみ）

────────────
🛠️オプション

《+1000円》
■ カバーデザイン変更
■ ポスター
・掲載文字／サイズ／印刷所をご記載ください。
・「視認性重視」「デザイン重視」の希望があれば参考にします。
・スペースNo発表後の着手となる場合は＋8日程度を目安としてください。

《+2000円》
■ しおり
■ お品書き（＋8日）
・掲載点数目安：4点まで
・5点以上は1点ごとに＋500円（目安）
・表紙確定後に制作開始します。
・同時進行希望の場合はお知らせください。

《+3000円》
■ アンソロジー、合同誌（+追加日数相談）
・制作に関わる人物が複数になる依頼が該当します。
■ 表紙デザイン踏襲データ（＋3日〜）
・本文用表紙ロゴ、本文（扉、目次、奥付他）、表2-3、カバー下、配信用ジャケット、ノベルティなど
■ 版分け／箔押し／白版／特色版等（＋2～5日）
・日数目安として箔押しだと2〜3日、特色や白版は5日程度必要となります。

《+2000～8000円》
■ 特急対応
・優先対応または納期短縮時に発生

《+6000円》
■ 電子販売使用料
・電子プラットフォームを利用して閲覧する販売が対象です。
（ストリーム配信やダウンロード販売など。Kindle、DLsite、BOOTHダウンロード、FANBOX、Fantia、その他）
・後日販売する場合も利用申請をお願いいたします。

</textarea>

      <button
        class="copy-button"
        data-target="template-1"
      >
        テンプレートをコピー
      </button>

    </section>


    <!-- お品書きテンプレート -->

    <section class="template">

      <h2 class="template-title">
        お品書き依頼テンプレート
      </h2>

      <textarea
        id="template-2"
        class="template-text"
        readonly
      >お品書き

● 納品希望日
○月○日まで
※ 納品日当日に利用予定がある依頼はご遠慮下さい。必ず余裕を持った指定をお願いします。

● イベント名（公式URL）

● スペース番号

● サークル名／HN

● 掲載点数

● 掲載予定の頒布物、その他掲載したい文字情報
そのままコピペするため誤字にご注意ください。

● 色再現の優先順位
SNS／印刷

● デザイン要望
・全体の雰囲気（シンプル／可愛い／繊細／上品／かっこいい／ダイナミック、など。要素がぶつからなければ複数掛け合わせ可）
・余白（多め、少なめ）
・デコレーション（多め、少なめ）
・明度（明るめ、暗め）
・彩度（鮮やか、くすみ）
・濃度（濃い、薄い）
※上記の全てが反映されるとは限りません。絶対に押さえてほしいポイントがあればその旨を記載願います。

● 参考資料
制作イメージに近い参考資料を1点のみ必ずご準備の上でご依頼ください。当方の作例で近いものを選んで頂いて補足説明を頂いてもOKです。
例：「参考資料のような配置デザインにしたいが、もう少し色を淡くしてほしい」、「多少視認性が落ちてもオシャレなフォントにしたい」など。

● 支給データ
支給データはZipなどにまとめてクラウド経由でお送りください。
※ 必ず完成した段階でのご依頼をお願いします。差し替えには別途費用が発生します。

● その他のご要望
「やってほしくないこと」も含め、依頼時点で必ずご記載ください。
「値札がないので視認性重視」「新刊を一番目立たせたい」「ポスター兼用でお品書き全体を目立たせたい」など、ご依頼の目的などあれば共有ください。目的によって制作するデザインが異なります。</textarea>

      <button
        class="copy-button"
        data-target="template-2"
      >
        テンプレートをコピー
      </button>

    </section>


    <footer>
      © KODA DESIGN ROOM
    </footer>

  </main>


  <script>
    document.querySelectorAll(".copy-button").forEach((button) => {

      button.addEventListener("click", async () => {

        const textarea = document.getElementById(
          button.dataset.target
        );

        const originalText = button.textContent;

        try {

          await navigator.clipboard.writeText(
            textarea.value
          );

          button.textContent = "コピーしました";

        } catch (error) {

          textarea.select();

          document.execCommand("copy");

          button.textContent = "コピーしました";

        }

        setTimeout(() => {

          button.textContent = originalText;

        }, 2000);

      });

    });
  </script>

</body>
</html>
